<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="../icons/icon32.png" alt="" width="20" height="20"><h1 id="heading">Highlight a word</h1></header>
  <form id="form">
    <input id="term" placeholder="word…" autocomplete="off" autofocus>
    <button id="go" type="submit">Highlight</button>
  </form>
  <p id="result" class="muted"></p>
  <div class="row">
    <label>Color <input id="color" type="color" value="#ffe066"></label>
    <button id="count" type="button">Count words</button>
  </div>
  <footer><a id="options" href="#">Options</a> · <a href="../options/options.html" target="_blank">Open options in tab</a></footer>
  <script src="popup.js"></script>
</body>
</html>
